name: Deploy to GitHub Pages

# The site is a Next.js 16 app that must be exported STATICALLY: Pages serves
# files, there is no Node runtime. `NEXT_OUTPUT=export` turns on
# `output: "export"` in next.config.ts, and the analysis endpoint is a separate
# FastAPI service the browser calls directly (NEXT_PUBLIC_API_BASE).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build (static export)
        env:
          NEXT_OUTPUT: export
          # A PROJECT site is served from https://<user>.github.io/<repo>/, so
          # every asset needs the repo prefix. A user/organisation page must
          # leave this empty, which is what a repo named <user>.github.io does.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
          NEXT_PUBLIC_API_BASE: ${{ vars.API_BASE_URL }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
